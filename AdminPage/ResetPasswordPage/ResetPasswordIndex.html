<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="icon" type="image/x-icon" href="../../ojhag.png">
    <link rel="stylesheet" href="ResetPasswordStyle.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div id="MainBody">
        <div id="TitleBar">
            <div id="resetPageLogo"><img src="../../ojhag.png" alt="Reset Password Icon"></div>
            <h1>Reset Password</h1>
            <p class="reset-description">Enter your new password below.</p>
        </div>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">
                        New Password
                    </label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleNewPassword"
                            class="password-toggle"
                            aria-label="Show password"
                            title="Show password"
                        >
                            <i
                                id="newPasswordIcon"
                                class="fas fa-eye"
                            ></i>
                        </button>
                    </div>

                    <small id="newPasswordError"></small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm new password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="password-toggle"
                            aria-label="Show password"
                            title="Show password"
                        >
                            <i
                                id="confirmPasswordIcon"
                                class="fas fa-eye"
                            ></i>
                        </button>
                    </div>

                    <small id="confirmPasswordError"></small>
                </div>

                <div
                    id="resetMessage"
                    class="reset-message"
                    style="display: none;"
                ></div>

                <button
                    type="submit"
                    id="resetPasswordBtn"
                >
                    <i class="fas fa-key"></i>
                    <span id="resetPasswordBtnText">
                        Reset Password
                    </span>
                </button>

            </form>

            <div class="back-login">
                <a href="../LoginPage/LoginIndex.html">
                    <i class="fas fa-arrow-left"></i>
                    Back to Login
                </a>
            </div> 

        <div id="FooterBox">
            <nav id="FooterPublicLinks">
                <a href="../../index.html"><i class="fas fa-house"></i> गृह पृष्ठ</a>
                <a href="../../SearchPage/SearchIndex.html"><i class="fas fa-search"></i> खोज्नुहोस्</a>
                <a href="../../RequestPage/RequestIndex.html"><i class="fas fa-chalkboard"></i> अनुरोध पठाउनुहोस्</a>
            </nav>
            <nav id="FooterPrivateLinks">
                <a href="../ViewRequestPage/ViewRequestIndex.html"><i class="fas fa-inbox"></i> अनुरोध हेर्नुहोस्</a>
                <a href="../AdminDashboardPage/AdminDashboardIndex.html"><i class="fas fa-user-plus"></i> एडमिन ड्यासबोर्ड</a>
                <a href="../AddMemberPage/AddMemberIndex.html"><i class="fas fa-user-plus"></i> सदस्य थप्नुहोस्</a>
            </nav>
            <p id="copyright">© <a href="https://www.facebook.com/profile.php?id=100014476511307" target="_blank">ओझा बन्धु प्रतिष्ठान, दमक</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../SupabaseConfig.js"></script>
    <script src="ResetPasswordScript.js"></script>

</body>
</html>
